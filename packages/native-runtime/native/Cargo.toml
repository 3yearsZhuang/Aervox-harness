[package]
name = "aervox-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "AGPL-3.0-or-later"

[features]
default = ["sqlite-bundled"]
sqlite-bundled = ["rusqlite/bundled"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }
rusqlite = { version = "=0.37.0" }
base64 = "=0.22.1"
sha2 = "=0.10.9"
fs2 = "=0.4.3"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.177"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.3"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication", "libc"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSDate", "NSRunLoop"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "=0.13.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }
