[tools]
node = "24"
pnpm = "11.22.0"
vale = "3.18.0"

[settings]
env_file = ".env"

[env]
# ── 配置优先级声明（缺陷6）──────────────────────────────
# 进程环境变量 > .env（aervox 脚本/ mise env_file 加载）> 本 [env] 注入值 > 代码内置默认。
# mise 注入不会覆盖调用方已导出的同名变量；此处仅设项目级默认。
AERVOX_PROJECT = "aervox-harness"
AERVOX_NODE_MIN = "22.19"
AERVOX_LOOP_PROVIDER = "llm"

# ── 常用项目操作 ────────────────────────────────────────────

[tasks]
# 安装依赖（锁定版本，保证可复现）
install = "pnpm install --frozen-lockfile"

# 极速本地增量门禁（CI 配置一致性 + 增量代码构建/类型/测试 + 增量文档检查，15~30秒完成）
ci-fast = "node --test scripts/ci-scope.test.mjs && node scripts/check-affected.mjs && node scripts/docs-lint-affected.mjs"
ci-affected = "mise tasks run ci-fast"

# 本地代码门禁（免重复 install，受控 2 并发）
ci-code = "pnpm check:boundary && pnpm check:ci-config && pnpm check:artifacts && pnpm build && pnpm typecheck && pnpm test"

# 全量冷启动代码门禁（对齐 GitHub Actions CI，含 frozen-lockfile install）
ci-code-full = "pnpm install --frozen-lockfile && pnpm check:boundary && pnpm check:ci-config && pnpm check:artifacts && pnpm build && pnpm typecheck && pnpm test"

# 生成插件分发包 dist-plugins/（gitignore 生成物的声明恢复入口，冷检出后由本任务重建；
# 产物字节可重现，回归见 scripts/export-plugins.test.mjs）
package-plugins = "pnpm package:plugins"

# 增量代码与文档独立入口
check-affected = "node scripts/check-affected.mjs"
docs-lint-affected = "node scripts/docs-lint-affected.mjs"

# 本地全量文档门禁：Markdown lint + 术语散文 lint + 治理/本地链接校验
ci-docs = "node --test scripts/docs-*.test.mjs && npx markdownlint-cli2 --config .markdownlint-cli2.jsonc 'docs/**/*.md' 'README.md' 'AGENTS.md' 'CONTRIBUTING.md' 'plan.md' && mise tasks run docs-lint-prose && mise tasks run docs-validate"

# 术语/散文一致性（配置见 .vale.ini，错误级别阻断）
docs-lint-prose = "vale --minAlertLevel=error docs README.md AGENTS.md CONTRIBUTING.md plan.md"

# 文档 ID、元数据、登记表与本地链接/锚点一致性
docs-validate = "node scripts/docs-governance.mjs --strict"

# 自动从文档 Front Matter 同步 DOC_REGISTRY.md 核验日期
docs-sync = "node scripts/docs-governance.mjs --sync-registry"

# 自动从文档元数据生成 document-catalog.json 机器目录
docs-catalog = "node scripts/docs-governance.mjs --generate-catalog"

# 检查当前代码变动是否命中任何文档的 review_triggers
docs-triggers = "node scripts/docs-governance.mjs --check-triggers"

# 开发：API + 桌面端（见 package.json scripts.dev:desktop）
dev-desktop = "pnpm dev:desktop"

# 全量类型检查
typecheck = "pnpm typecheck"

# 运行全部测试（受控 4 并发，避免超线程争抢）
test = "pnpm test"

# 快速单元层：仅运行不建库、不起服务的轻量包（纯逻辑 + DOM 组件测试，共 9 包 71 文件，10 秒级完成）
test-fast = "pnpm test:fast"
test-unit = "pnpm test:unit"

# 智能增量测试：自动识别基准分支并仅运行变更包及其全部下游依赖的测试
test-affected = "pnpm test:affected"

# 专项子包快速测试
test-api = "pnpm test:api"
test-repos = "pnpm test:repos"

# 全量构建
build = "pnpm build"

# 清理构建产物与缓存
clean = "rm -rf apps/*/dist apps/*/out packages/*/dist node_modules/.turbo && pnpm install"
