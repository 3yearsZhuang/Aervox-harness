[tools]
node = "24"
pnpm = "11.22.0"
vale = "3.18.0"

[settings]
env_file = ".env"

[env]
AERVOX_PROJECT = "aervox-harness"
AERVOX_NODE_MIN = "22.19"
AERVOX_LOOP_PROVIDER = "llm"

# ── 常用项目操作 ────────────────────────────────────────────

[tasks]
# 安装依赖（锁定版本，保证可复现）
install = "pnpm install --frozen-lockfile"

# 本地代码门禁（对齐 .github/workflows/ci.yml，含 frozen-lockfile install）
ci-code = "pnpm install --frozen-lockfile && pnpm check:boundary && pnpm build && pnpm typecheck && pnpm test"

# 本地文档门禁：Markdown lint + 术语散文 lint + 治理/本地链接校验
ci-docs = "npx markdownlint-cli2 --config .markdownlint-cli2.jsonc 'docs/**/*.md' 'README.md' 'AGENTS.md' 'CONTRIBUTING.md' && mise tasks run docs-lint-prose && mise tasks run docs-validate"

# 术语/散文一致性（配置见 .vale.ini，错误级别阻断）
docs-lint-prose = "vale --minAlertLevel=error docs README.md AGENTS.md CONTRIBUTING.md"

# 文档 ID、元数据、登记表与本地链接/锚点一致性
docs-validate = "node scripts/docs-governance.mjs"

# 开发：API + 桌面端（见 package.json scripts.dev:desktop）
dev-desktop = "pnpm dev:desktop"

# 全量类型检查
typecheck = "pnpm typecheck"

# 运行全部测试
test = "pnpm test"

# 全量构建
build = "pnpm build"

# 清理构建产物与缓存
clean = "rm -rf apps/*/dist apps/*/out packages/*/dist node_modules/.turbo && pnpm install"
