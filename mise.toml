[tools]
node = "24"
pnpm = "11.22.0"
# Capacitor Android emits Java 21; keep the JDK reproducible without global overrides.
java = "21.0.13+9.0.LTS"
rust = "1.98.0"
vale = "3.18.0"
# Markdown 门禁工具纳入工具链真源：此前用 `npx markdownlint-cli2` 每次现取，
# 既不在 [tools] 也不在 package.json —— 版本不受控（§51），且绕过统一依赖治理（§57）。
# 固定版本后 `mise x` 会把它放进 PATH，脚本可直接 spawnSync 调用，不再依赖 npx 缓存。
"npm:markdownlint-cli2" = "0.23.3"

[env]
# ── 配置优先级声明（缺陷6）──────────────────────────────
# 进程环境变量 > .env > 项目默认 > 代码内置默认。
# settings.env_file 会覆盖调用方；共享脚本显式保留调用方已导出的值。
_.source = "scripts/project-env.sh"

# ── 常用项目操作 ────────────────────────────────────────────

[tasks]
# 安装依赖（锁定版本，保证可复现）
install = "node scripts/core-submodule.mjs --init && pnpm install --frozen-lockfile"

# 本地增量门禁；纯项目文档改动跳过代码守卫、业务构建与原生编译。
ci-fast = "node --test scripts/ci-scope.test.mjs && node scripts/check-affected.mjs && node scripts/docs-lint-affected.mjs"
ci-affected = "mise tasks run ci-fast"

# 本地代码门禁（免重复 install，受控 2 并发）
ci-code = "pnpm check:guards && pnpm check:boundary && pnpm check:ci-config && pnpm check:artifacts && pnpm build && pnpm check:standards && pnpm typecheck && pnpm test && pnpm check:hls && pnpm check:memory-deletion && pnpm check:deletion-fault-testing && pnpm check:deletion-fault-integration && mise tasks run native-search-check && mise tasks run native-runtime-check"

# 全量冷启动代码门禁（对齐 GitHub Actions CI，含 frozen-lockfile install）
ci-code-full = "node scripts/core-submodule.mjs --init && pnpm install --frozen-lockfile && pnpm check:guards && pnpm check:boundary && pnpm check:ci-config && pnpm check:artifacts && pnpm build && pnpm check:standards && pnpm typecheck && pnpm test && pnpm check:hls && pnpm check:memory-deletion && pnpm check:deletion-fault-testing && pnpm check:deletion-fault-integration && mise tasks run native-search-check && mise tasks run native-runtime-check"

# 代码守卫（禁用标识符 + 宿主领域纯度 + 类型边界 + 依赖提升 + 可移除实现）
check-guards = "pnpm check:guards"

# 生成插件分发包 dist/plugins/（gitignore 生成物的声明恢复入口，冷检出后由本任务重建；
# 产物字节可重现，回归见 scripts/export-plugins.test.mjs）
package-plugins = "pnpm package:plugins"
plugin = "pnpm plugin"
check-standards = "pnpm --filter @aervox/contracts build && pnpm check:standards"

# 增量代码与文档独立入口
check-affected = "node scripts/check-affected.mjs"
docs-lint-affected = "node scripts/docs-lint-affected.mjs"

# 文档门禁：docs 与根文档（含 CHANGELOG）的格式、术语、ID、ADR 状态与本地链接/资产。
ci-docs = "node --test scripts/docs-*.test.mjs && markdownlint-cli2 --config .markdownlint-cli2.jsonc 'docs/**/*.md' 'README.md' 'AGENTS.md' 'CONTRIBUTING.md' 'CHANGELOG.md' 'plan.md' && mise tasks run docs-lint-prose && mise tasks run docs-validate"

# 术语/散文一致性（配置见 .vale.ini，错误级别阻断）
docs-lint-prose = "vale --minAlertLevel=error docs README.md AGENTS.md CONTRIBUTING.md CHANGELOG.md plan.md"

# 稳定 ID、ADR 状态与本地链接/锚点一致性
docs-validate = "node scripts/docs-governance.mjs"

# 开发：API + 桌面端（见 package.json scripts.dev:desktop）
dev-desktop = "pnpm dev:desktop"

# 全量类型检查
typecheck = "pnpm typecheck"

# 运行全部测试（受控 2 并发，避免超线程争抢）
test = "pnpm test"

# 选定包测试：核心逻辑、领域契约、前端组件与插件；范围以 package.json 为准
test-unit = "pnpm test:unit"
test-fast = "pnpm test:unit"

# 架构与门禁脚本守护测试
test-guards = "pnpm test:guards"

# 智能增量测试：自动识别基准分支并仅运行变更包及其全部下游依赖的测试
test-affected = "pnpm test:affected"

# 全量构建
build = "pnpm build"

# 清理构建产物与缓存
clean = "node scripts/clean-generated.mjs"

[tasks.hls-agent]
description = "HLS research CLI (doctor/run/batch/report)"
run = "node scripts/hls-agent/cli.mjs"

[tasks.hls-check]
description = "Build core and test HLS research contracts"
run = "pnpm check:hls"

[tasks.native-toolchain-setup]
description = "Install format/lint components for the pinned Rust toolchain"
run = "node scripts/install-native-tools.mjs"

[tasks.native-protocol-generate]
description = "Generate TypeScript IPC types from the shared native contract"
run = "node scripts/generate-native-protocol.mjs"

[tasks.native-search-check]
description = "Check the dependency-free Rust vector pilot and benchmark contracts"
run = "cargo fmt --manifest-path native/tools/vector-pilot/Cargo.toml --check && cargo test --locked --manifest-path native/tools/vector-pilot/Cargo.toml && cargo build --locked --manifest-path native/tools/vector-pilot/Cargo.toml && cargo clippy --all-targets --locked --manifest-path native/tools/vector-pilot/Cargo.toml -- -D warnings && node --test scripts/native-search.test.mjs"

[tasks.native-search-benchmark]
description = "Compare fixed synthetic search workloads (no production database access)"
run = "pnpm exec turbo run build --filter=@aervox/repositories --filter=@aervox/api && cargo build --release --locked --manifest-path native/tools/vector-pilot/Cargo.toml && node scripts/benchmark-native-search.mjs"

[tasks.native-runtime-build]
description = "Build the native component and its verified platform artifact"
run = "pnpm exec turbo run native:build --filter=@aervox/native-runtime"

[tasks.native-runtime-check]
description = "Check native platform code and executable lifecycle contracts"
run = "node scripts/generate-native-protocol.mjs --check && node --test scripts/native-layout.test.mjs && cargo fmt --manifest-path native/crates/runtime/Cargo.toml --check && cargo test --locked --manifest-path native/crates/runtime/Cargo.toml && cargo clippy --all-targets --locked --manifest-path native/crates/runtime/Cargo.toml -- -D warnings && pnpm exec turbo run native:build --filter=@aervox/native-runtime && pnpm --filter @aervox/native-runtime test && pnpm exec turbo run build --filter=@aervox/api --filter=@aervox/worker && node --test scripts/native-runtime-smoke.test.mjs"

[tasks.native-runtime-benchmark]
description = "Compare file SQLite engines, native audio and isolated archive CPU work"
run = "pnpm exec turbo run native:build --filter=@aervox/native-runtime && pnpm exec turbo run build --filter=@aervox/api && node scripts/benchmark-native-runtime.mjs"

[tasks.native-runtime]
description = "Native info, OS probe, signing and explicit supervisor lifecycle"
run = "node scripts/native-runtime.mjs"

[tasks.core-benchmark]
description = "Compare core harness turn latency, visible TTFT and cancellation"
run = "pnpm benchmark:core"

[tasks.drill-removability]
description = "Temporarily remove plugin implementations, verify isolation, then restore"
run = "pnpm drill:removability"
