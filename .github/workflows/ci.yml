# 触发路径契约：本文件的 paths 必须覆盖 turbo.json 声明的全部**包外**输入
# （如 `@aervox/api#test` 的 `../../plugins/**`）与根级 `globalDependencies`。
# 这些路径的改动若既不触发工作流、也不使缓存失效，就会被静默跳过。
# 回归守卫：scripts/ci-scope.test.mjs（经 `pnpm check:ci-config` 接入 ci-code）。
name: CI

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "plugins/**"
      - "modules/**"
      - ".gitmodules"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
      - "tsconfig.base.node.json"
      - "vitest.shared.ts"
      - "mise.toml"
      - "scripts/**"
      - "e2e/**"
      - "playwright.config.ts"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "plugins/**"
      - "modules/**"
      - ".gitmodules"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
      - "tsconfig.base.node.json"
      - "vitest.shared.ts"
      - "mise.toml"
      - "scripts/**"
      - "e2e/**"
      - "playwright.config.ts"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  build:
    name: Install, build & typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore mise cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/mise/installs
            ~/.local/share/mise/cache
          key: mise-${{ runner.os }}-${{ hashFiles('mise.toml') }}

      - name: Install tools (node + pnpm from mise.toml)
        run: mise install

      # 方案 A：缓存 pnpm store，install 由全量下载变为硬链接，秒级完成
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      # 显式按锁文件安装（先恢复 store 缓存再安装）：不依赖 pnpm 的隐式自动安装，
      # 锁文件与 package.json 不一致时在此直接失败，而不是静默重新解析。
      - name: Install dependencies (frozen lockfile)
        run: mise exec -- pnpm install --frozen-lockfile

      # 方案 B：持久化 Turbo 本地缓存，按内容哈希跳过未变更包，
      # 实现"只验证更改部分及其下游"。
      # 注意：save key 必须每次运行唯一（附加 run_id）——actions/cache 在
      # 精确命中既有 key 后不会执行 save，若 key 只含 lockfile 哈希，
      # lockfile 不变期间代码演进产生的新缓存条目将永远无法写回，
      # 后续 PR 只能重复真跑已变更的包，缓存形同虚设。
      - name: Restore turbo cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/turbo-cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Verify submodules
        run: |
          git submodule status --recursive

      # 生成物恢复入口：`dist-plugins/` 为 gitignore 产物，由声明任务现场重建。
      # 冷检出下必须能恢复；同时任何测试都不得把它当隐式依赖（否则全新检出必然 ENOENT）。
      - name: Generate plugin bundles (declared task)
        run: |
          mise tasks run package-plugins
          count=$(find dist-plugins -maxdepth 1 -name '*.aervox-plugin' | wc -l | tr -d ' ')
          echo "已生成分发包: $count"
          if [ "$count" -lt 1 ]; then
            echo "::error::声明任务 package-plugins 未生成任何 .aervox-plugin 分发包"
            exit 1
          fi

      # 可选增强：Turbo Remote Cache（Vercel，条目级跨 PR 共享）。
      # 仅在仓库配置了 TURBO_TOKEN / TURBO_TEAM secrets 时注入；
      # 未配置时 turbo 优雅降级为纯本地（actions/cache）缓存，CI 不受影响。
      # 注意：secrets context 不允许出现在 step 的 if 条件中（workflow 校验
      # 会直接失败、0 job 创建），因此是否启用改由脚本内判断。
      - name: Enable Turbo remote cache
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: |
          if [ -n "$TURBO_TOKEN" ]; then
            echo "TURBO_TOKEN=$TURBO_TOKEN" >> "$GITHUB_ENV"
            echo "TURBO_TEAM=$TURBO_TEAM" >> "$GITHUB_ENV"
            echo "Turbo remote cache enabled."
          else
            echo "Turbo remote cache not configured; using local cache only."
          fi

      - name: Run code gate (build + typecheck + test)
        env:
          TURBO_CACHE_DIR: ${{ runner.temp }}/turbo-cache
        run: mise tasks run ci-code

      # 失败也保存（if: always()）：已成功任务的缓存条目不应随本次
      # 门禁失败而丢弃；save key 与本次 restore key 一致（run_id 唯一，必然 miss → 必然保存）。
      - name: Save turbo cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ runner.temp }}/turbo-cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}

  # E2E（API 级）：spawn 真实 API 进程 + 文件 SQLite 的端到端验证。
  # 与 build job 并行互不阻塞：代码门禁失败时本 job 仍独立给出 E2E 信号。
  e2e:
    name: E2E (API-level Playwright)
    runs-on: ubuntu-latest
    # 观察期（非阻塞）：E2E 初入 CI，先以 continue-on-error 收集稳定性数据
    # （失败仅标注 warning，不拦截 PR）。连续稳定后（约两周零 flaky）改为
    # false 转为强制门禁。
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore mise cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/mise/installs
            ~/.local/share/mise/cache
          key: mise-${{ runner.os }}-${{ hashFiles('mise.toml') }}

      - name: Install tools (node + pnpm from mise.toml)
        run: mise install

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies (frozen lockfile)
        run: mise exec -- pnpm install --frozen-lockfile

      # 复用 build job 保存的 turbo 缓存（restore-only）：api 及上游依赖
      # 未变更时构建秒级命中；新缓存条目由 build job 统一回写，本 job 不重复 save。
      - name: Restore turbo cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/turbo-cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Verify submodules
        run: |
          git submodule status --recursive

      # E2E 为纯 API 级测试（Playwright request fixture，无浏览器用例），
      # 无需 playwright install 安装浏览器二进制。
      - name: Build API (with dependencies)
        env:
          TURBO_CACHE_DIR: ${{ runner.temp }}/turbo-cache
        run: mise exec -- pnpm exec turbo run build --filter=@aervox/api

      - name: Run E2E tests
        run: mise exec -- pnpm run test:e2e
