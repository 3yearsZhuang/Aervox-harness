name: CI

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "modules/**"
      - ".gitmodules"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
      - "mise.toml"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "modules/**"
      - ".gitmodules"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
      - "mise.toml"
      - "scripts/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  build:
    name: Install, build & typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore mise cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/mise/installs
            ~/.local/share/mise/cache
          key: mise-${{ runner.os }}-${{ hashFiles('mise.toml') }}

      - name: Install tools (node + pnpm from mise.toml)
        run: mise install

      # 方案 A：缓存 pnpm store，install 由全量下载变为硬链接，秒级完成
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      # 方案 B：持久化 Turbo 本地缓存，按内容哈希跳过未变更包，
      # 实现"只验证更改部分及其下游"
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/turbo-cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Verify submodules
        run: |
          git submodule status --recursive

      - name: Run code gate (build + typecheck + test)
        env:
          TURBO_CACHE_DIR: ${{ runner.temp }}/turbo-cache
        run: mise tasks run ci-code
