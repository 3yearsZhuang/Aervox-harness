name: Docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "scripts/docs-governance.mjs"
      - ".markdownlint-cli2.jsonc"
      - "mise.toml"
      - ".vale.ini"
      - ".vale/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "scripts/docs-governance.mjs"
      - ".markdownlint-cli2.jsonc"
      - "mise.toml"
      - ".vale.ini"
      - ".vale/**"

permissions:
  contents: read

jobs:
  lint:
    name: Markdown lint & link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore mise cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/mise/installs
            ~/.local/share/mise/cache
          key: mise-${{ runner.os }}-${{ hashFiles('mise.toml') }}

      - name: Install tools (node + pnpm from mise.toml)
        run: mise install

      - name: Markdown lint (via mise task)
        run: mise tasks run ci-docs

      - name: Link check (docs + root documentation; top-level reference/ and demos/ are not targets)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,429,403 README.md docs AGENTS.md CONTRIBUTING.md
