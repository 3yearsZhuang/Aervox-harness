packages:
  - "apps/*"
  - "packages/*"
  # CR-060：第一方插件的实现与声明同置于 plugins/<id>/，实现以 workspace 包消费
  # （AVX-CAP-001「消费一律走 workspace 包」，禁止路径 hack、禁止复制代码引用）。
  - "plugins/*"
  # CR-065：根界面与设置面板实现位于 surfaces/<id>/，作为编译期第一方界面表面装配
  - "surfaces/*"
  - "research/*"

# pnpm 11 reads installer settings here. Preserve the resolved lockfile policy.
autoInstallPeers: true

# pnpm 11：允许 esbuild / electron 构建脚本（下载平台二进制），显式阻断 better-sqlite3 原生编译（@aervox/repositories 实际使用 @libsql/client）
# electron-winstaller 为 electron-builder 传递依赖（仅 Squirrel 目标使用，本项目用 NSIS），不执行安装脚本
allowBuilds:
  esbuild: true
  electron: true
  better-sqlite3: false
  electron-winstaller: false
  # Historical LlamaIndex research fixture uses TextNode/VectorStoreIndex only;
  # its transitive code parser is not exercised and must not build native code.
  tree-sitter: false

# HYG-11: only the affected installed versions are redirected to compatible fixes.
# Keep selectors narrow; remove an override once upstream no longer resolves that version.
overrides:
  "fast-uri@3.1.5": "3.1.8"
  "undici@6.28.0": "6.28.1"
  "brace-expansion@1.1.18": "1.1.21"
  "brace-expansion@2.1.4": "2.1.7"
  "brace-expansion@5.0.9": "5.0.12"
  "http-cache-semantics@4.2.0": "4.3.0"
  "shell-quote@1.10.0": "1.11.0"

patchedDependencies:
  drizzle-orm@0.45.4: patches/drizzle-orm@0.45.4.patch
